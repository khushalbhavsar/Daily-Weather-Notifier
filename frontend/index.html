<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Daily Weather Notifier</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f7fafc
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            width: 360px
        }

        input,
        button,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid #ddd
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: #fff;
            border: 0
        }

        .small {
            font-size: 0.9rem;
            color: #555
        }

        .msg {
            margin-top: 12px
        }
    </style>
</head>

<body>
    <div class="card">
        <h2 style="margin:0 0 8px 0">Daily Weather Notifier</h2>
        <p class="small">Enter your email to get daily weather updates. Optionally provide a phone number for SMS.</p>

        <form id="subForm">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />

            <label for="phone">Phone (optional)</label>
            <input id="phone" name="phone" type="tel" placeholder="+919876543210" />

            <label for="city">City</label>
            <input id="city" name="city" type="text" placeholder="Mumbai" value="Mumbai" />

            <label for="country">Country Code</label>
            <input id="country" name="countryCode" type="text" placeholder="IN" value="IN" maxlength="2" />

            <button type="submit">Subscribe</button>
        </form>

        <div class="msg" id="msg"></div>

        <hr />
        <p class="small">Developer: Replace <code>API_URL</code> in <code>app.js</code> with your deployed API Gateway
            endpoint or use a proxy.</p>
    </div>

    <script src="app.js"></script>
</body>

</html>
